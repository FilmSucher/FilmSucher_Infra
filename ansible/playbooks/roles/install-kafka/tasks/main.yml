- name: Install dependencies
  apt:
    name: [wget, tar]
    state: present
    update_cache: true
    
- name: Download Kafka
  get_url:
    url: https://downloads.apache.org/kafka/3.7.2/kafka_2.13-3.7.2.tgz
    dest: /tmp/kafka.tgz
    
- name: Extract Kafka
  unarchive:
    src: /tmp/kafka.tgz
    dest: /opt/
    remote_src: true
  register: kafka_unarchived

- name: Symlink kafka directory
  file:
    src: /opt/kafka_2.13-3.7.2
    dest: /opt/kafka
    state: link
    force: true