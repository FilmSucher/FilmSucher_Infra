- name: Ensure Prometheus config directory exists
  file:
    path: /etc/prometheus
    state: directory
    owner: root
    group: root
    mode: '0755'
    
- name: Copy Prometheus prometheus.yml
  copy:
    src: /shared/infra_prometheus/prometheus.yml
    dest: /etc/prometheus/prometheus.yml
    owner: root
    group: root
    mode: '0644'

- name: Restart prometheus
  systemd:
    name: prometheus
    state: restarted    
    enabled: true